[project]
name = "energy_monitor"
version = "0.0.0"
description = "A simple energy monitor."
requires-python = ">=3.14"

# =============================================================================
# DEPENDENCIES
# Managed by uv. Run `uv sync` to install.
# Docs: https://docs.astral.sh/uv/
# =============================================================================

dependencies = [

    
    

    "django~=6.1.1",
    "django-extensions~=4.1",
    "django-filter~=26.1",
    "httpx>=0.28,<1.0",
    "whitenoise~=6.12",
    "pydantic~=2.13.5",
    "django-environ~=0.14.0",
    "gunicorn~=26.2.0",
    
    "django-health-check~=4.5.1",
    "psutil~=7.2",
    

    
    
    
    
    
    
]

[dependency-groups]
dev = [
     "marimo~=0.24.2", 
    
    "aiosmtpd~=1.4", # for mail_debug
    "django-browser-reload~=1.21",
    "django-debug-toolbar~=6.3",
    "django-watchfiles~=1.4",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff~=0.15.21",
    "django-stubs[compatible-mypy]>=6.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "core", "config"]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.base"

[[tool.mypy.overrides]]
module = ["knox.*", "environ.*", "health_check.*"]
ignore_missing_imports = true